[build]
  # Build from root directory for monorepo
  base = "/"

  # Directory to publish
  publish = "web/.next"

  # Build command - install dependencies at root, reinstall lightningcss for native binaries, then build
  command = "npm install && cd web && npm install lightningcss --force && npx next build"
  
  # Environment variables for build time
  [build.environment]
    NODE_VERSION = "20"
    # Disable secrets scanning for Firebase API keys (they are public)
    SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Use Netlify's Next.js plugin for proper deployment
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Next.js server-side rendering configuration
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true