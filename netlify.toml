[build]
  # Build from web workspace in monorepo
  base = "web"

  # Directory to publish (relative to base)
  publish = ".next"

  # Build command - Netlify handles dependency install; just run the Next.js build
  command = "npm run build"
  
  # Environment variables for build time
  [build.environment]
    NODE_VERSION = "20"
    # Disable secrets scanning for Firebase API keys (they are public)
    SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Use Netlify's Next.js plugin for proper deployment
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Next.js server-side rendering configuration
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true