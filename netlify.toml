[build]
  # Build from root directory for monorepo
  base = "/"

  # Directory to publish
  publish = "web/.next"

  # Build command - install dependencies at root, then build web with webpack directly
  command = "npm install && cd web && npx next build --webpack"
  
  # Environment variables for build time
  [build.environment]
    NODE_VERSION = "20"
    # Disable secrets scanning for Firebase API keys (they are public)
    SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Next.js server-side rendering configuration
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# Redirect rules for Next.js App Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200